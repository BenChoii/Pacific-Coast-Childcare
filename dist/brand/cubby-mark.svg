<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cubby">
  <defs>
    <linearGradient id="cub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8FD6"/>
      <stop offset="0.55" stop-color="#0E74C1"/>
      <stop offset="1" stop-color="#5167B0"/>
    </linearGradient>
  </defs>
  <!-- ears -->
  <circle cx="17" cy="17" r="9" fill="url(#cub)"/>
  <circle cx="47" cy="17" r="9" fill="url(#cub)"/>
  <circle cx="17" cy="17" r="4" fill="#BFD8E6"/>
  <circle cx="47" cy="17" r="4" fill="#BFD8E6"/>
  <!-- head -->
  <circle cx="32" cy="35" r="21" fill="url(#cub)"/>
  <!-- cheeks -->
  <circle cx="20.5" cy="40" r="4" fill="#F2C6CC" opacity="0.85"/>
  <circle cx="43.5" cy="40" r="4" fill="#F2C6CC" opacity="0.85"/>
  <!-- muzzle -->
  <ellipse cx="32" cy="41" rx="12" ry="9.5" fill="#FFFFFF"/>
  <!-- eyes -->
  <circle cx="25" cy="32" r="2.8" fill="#0F4068"/>
  <circle cx="39" cy="32" r="2.8" fill="#0F4068"/>
  <circle cx="25.9" cy="31.1" r="0.9" fill="#FFFFFF"/>
  <circle cx="39.9" cy="31.1" r="0.9" fill="#FFFFFF"/>
  <!-- nose + smile -->
  <ellipse cx="32" cy="38" rx="3.2" ry="2.4" fill="#0F4068"/>
  <path d="M27 43 Q32 47.5 37 43" fill="none" stroke="#0F4068" stroke-width="2.2" stroke-linecap="round"/>
</svg>
