<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cubby">
  <defs>
    <linearGradient id="cub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8FD6"/>
      <stop offset="0.55" stop-color="#0E74C1"/>
      <stop offset="1" stop-color="#5167B0"/>
    </linearGradient>
    <linearGradient id="nook" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B3050"/>
      <stop offset="1" stop-color="#155A8F"/>
    </linearGradient>
    <clipPath id="opening">
      <rect x="11" y="11" width="42" height="42" rx="10"/>
    </clipPath>
  </defs>
  <!-- cubby frame -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#cub)"/>
  <!-- nook interior -->
  <rect x="11" y="11" width="42" height="42" rx="10" fill="url(#nook)"/>
  <!-- bear peeking out of the nook -->
  <g clip-path="url(#opening)">
    <!-- ears -->
    <circle cx="21" cy="29" r="6.6" fill="url(#cub)"/>
    <circle cx="43" cy="29" r="6.6" fill="url(#cub)"/>
    <circle cx="21" cy="29" r="2.9" fill="#BFD8E6"/>
    <circle cx="43" cy="29" r="2.9" fill="#BFD8E6"/>
    <!-- head -->
    <circle cx="32" cy="42" r="15.5" fill="url(#cub)"/>
    <!-- cheeks -->
    <circle cx="23.5" cy="45.5" r="3" fill="#F2C6CC" opacity="0.85"/>
    <circle cx="40.5" cy="45.5" r="3" fill="#F2C6CC" opacity="0.85"/>
    <!-- muzzle -->
    <ellipse cx="32" cy="46.5" rx="8.8" ry="7" fill="#FFFFFF"/>
    <!-- eyes -->
    <circle cx="26.8" cy="39.8" r="2.1" fill="#0F4068"/>
    <circle cx="37.2" cy="39.8" r="2.1" fill="#0F4068"/>
    <circle cx="27.5" cy="39.1" r="0.7" fill="#FFFFFF"/>
    <circle cx="37.9" cy="39.1" r="0.7" fill="#FFFFFF"/>
    <!-- nose + smile -->
    <ellipse cx="32" cy="44.4" rx="2.5" ry="1.9" fill="#0F4068"/>
    <path d="M28.2 48 Q32 51.4 35.8 48" fill="none" stroke="#0F4068" stroke-width="1.9" stroke-linecap="round"/>
  </g>
  <!-- paws gripping the nook's bottom edge -->
  <g fill="url(#cub)" stroke="#0B3050" stroke-width="1">
    <ellipse cx="22.5" cy="53" rx="4.6" ry="3.4"/>
    <ellipse cx="41.5" cy="53" rx="4.6" ry="3.4"/>
  </g>
</svg>
