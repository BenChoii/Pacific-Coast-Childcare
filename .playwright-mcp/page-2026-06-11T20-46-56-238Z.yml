                - heading "Learning Foundations" [level=3] [ref=e128]
                - generic [ref=e129]: Early literacy, numeracy, and cognitive development
                - paragraph [ref=e130]:
                  - text: Early academic concepts don't need to be dry or repetitive. We introduce literacy, early mathematics, and language logic through engaging, structured activities that feel like play but build real neural pathways.
                  - text: Children explore letters, sounds, numbers, and basic problem-solving in a supportive environment. The goal is to cultivate a lifelong love for learning, preparing them for kindergarten and beyond with strong cognitive fundamentals.
              - img "A young child focused on learning letters and numbers in a bright room" [ref=e132]
