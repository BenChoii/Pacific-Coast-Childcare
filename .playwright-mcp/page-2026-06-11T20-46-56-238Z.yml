                - generic [ref=e138]: Confidence, voice, and small ownership — practiced daily
                - paragraph [ref=e139]:
                  - text: Confidence isn't a personality trait. It's a habit, built one circle-time turn at a time, through rotating responsibilities that give every child their moment.
                  - text: Through everyday opportunities to contribute, participate, and take ownership, children discover that confidence grows when it is practiced!
              - img "Preschool children gathered for a group activity with their teacher" [ref=e141]
