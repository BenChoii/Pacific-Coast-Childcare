            - generic [ref=e102]: 01 — Founder's Vision
            - generic [ref=e104]: Built with Vision
            - generic [ref=e106]: Ages 2.5 – 5
          - generic [ref=e107]:
            - heading "Preparing children for life, not just school." [level=2] [ref=e109]
            - paragraph [ref=e111]: When I set out to establish Pacific Coast Childcare Academy, my goal wasn't just to build another preschool or daycare center. I wanted to design an ecosystem that addresses early childhood with the depth, intention, and respect it truly deserves.
            - paragraph [ref=e113]: The years between two and five represent one of the most rapid windows of neurological development in a human's life. Yet, all too often, early childhood education is treated either as passive care or as a rigid preparation for standardized testing. I believe there is a better, warmer way.
            - paragraph [ref=e115]: Our curriculum combines structured academic foundations with purposeful, guided discovery and independent life skills. Pouring water, packing their own bag, naming a difficult emotion, or asking a big “what-if” scientific question are not distractions from learning — they are the core of it. We are not just preparing children for kindergarten; we are preparing them for a confident, capability-driven life.
            - paragraph [ref=e117]: “Children don't just need to be supervised; they need to be trusted. They don't just need rules; they need reasons. When we treat their curiosity with respect, they rise to the occasion every single time.”
